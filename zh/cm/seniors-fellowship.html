<h3>乐龄团契简介</h3>

<p>勿洛信义会华文部乐龄团契成立于2005年4月，团员约30人，当中包括年长会友和教会邻近的乐龄人士。</p>

<h3>团契时间</h3>

<p>每月第二，第四，星期五</p>

<p>早上11点</p>

<h3>团契聚会内容：</h3>

<p>诗歌赞美、脑力运动、有关圣经教导或生活常识的专题讲座；也有举行户外活动。</p>

<p><strong>欢迎乐龄人士参加！</strong></p>
