<h3>约书亚团契简介</h3>

<p>
  勿洛信义会约书亚团契成立于2017年3月，由伉俪团契转型而来。年龄21岁以上或不参与任何教会团契者都欢迎加入。由于年龄层差距大，约书亚团契就像一个三代同堂的属灵大家庭。追求『至于我和我家，我们必定事奉耶和华。』（约书亚记24：15下）的精神和意愿。大家彼此相亲相爱，互相鼓励扶持，同心敬拜神，竭力学习并遵行真理，建立一个荣耀主名的团契。
</p>

<h3>约书亚团团训：</h3>

<blockquote>
  <p>至于我和我家，我们必定事奉耶和华。(书24：15下)</p>
</blockquote>
