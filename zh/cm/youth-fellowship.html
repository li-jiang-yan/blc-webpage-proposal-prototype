<h3>青少年团契简介</h3>

<p>青少年团契成立于90年代。</p>

<h3>团契的宗旨</h3>

<p>带领青少年人来到神的家，帮助青少年在信仰上扎根，在神的话语上成长，在生活中活出基督徒的生命见证。</p>

<h3>聚会时间</h3>

<h4>少年团契（13至20岁）</h4>

<p>星期六旁晚 6:45 pm – 8:45 pm</p>

<h4>青年团契（21岁以上）</h4>

<p>每个月的第一和第三主日早上 11:45 am – 1:00 pm</p>

<h3>青少年团契聚会内容</h3>

<p>专题，查经，分享，户外活动（每两个月一次）等。</p>

<p><strong>欢迎所有青少年人参加！</strong></p>
