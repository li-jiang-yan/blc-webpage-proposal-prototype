<p>时间：10.45 am – 11.30 pm</p>

<p>正如米爾敦博士 (John Milton) 所說：</p>

<blockquote>
  <p>主日學一切學習的目的是讓人認識神，從而愛它，學像他。</p>
</blockquote>

<p>主日学的班级名字按着圣灵的果子，就是 仁爱，喜乐，和平，忍耐，恩慈，良善，信实，温柔，节制。</p>
