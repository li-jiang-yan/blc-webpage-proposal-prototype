<h3>姐妹团契简介</h3>

<p>
  勿洛信义会华文部姐妹团契成立于1984年8月4日。至今已<span id="sisters-fellowship-years"></span
  >年。感谢神的带领，姐妹们靠主的恩典，彼此分享，扶持，也一起成长。现有58位团员。此外，还有姐妹诗班。
</p>

<h3>团契时间</h3>

<p>每月的第二主日，早上11:45 am – 12:30 pm。</p>

<h3>团契聚会内容</h3>

<p>专题，金句分享，诗歌分享，烹饪，游戏，健康讲座，半日游等。</p>

<p><strong>欢迎所有姐妹参加！</strong></p>
