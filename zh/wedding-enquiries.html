<script>
function easterSunday(y) {
  // Gregorian Easter calculation (Meeus/Jones/Butcher algorithm)
  const a = y % 19;
  const b = Math.floor(y / 100);
  const c = y % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31); // 3 = March, 4 = April
  const day = ((h + l - 7 * m + 114) % 31) + 1;

  return new Date(y, month - 1, day);
}

function lentDates(y) {
  const easter = easterSunday(y);
  const ashWednesday = new Date(easter);
  ashWednesday.setDate(easter.getDate() - 46);

  const maundyThursday = new Date(easter);
  maundyThursday.setDate(easter.getDate() - 3);

  const goodFriday = new Date(easter);
  goodFriday.setDate(easter.getDate() - 2);

  return { ashWednesday, maundyThursday, goodFriday, easterSunday: easter };
}

function getUpcomingLentDates(from = new Date()) {
  const year = from.getFullYear();

  let dates = lentDates(year);
  if (dates.maundyThursday < new Date(from.getFullYear(), from.getMonth(), from.getDate())) {
    dates = lentDates(year + 1);
  }

  return dates;
}

function formatDate(date) {
  const day = date.getDate();
  const month = date.getMonth();
  const year = date.getFullYear();

  return `${year} 年 ${month + 1} 月 ${day} 日`;
}

function formatLentDates(dates) {
  const result = document.createElement("li");
  const ashWednesday = dates.ashWednesday;
  const maundyThursday = dates.maundyThursday;
  result.textContent = `${ashWednesday.getFullYear()} 大斋季节：${formatDate(ashWednesday)} 至 ${formatDate(maundyThursday)}`;
  return result;
}

const lentList = document.getElementById("lentList");
const upcomingLentDates = getUpcomingLentDates();
const futureLentDates = lentDates(upcomingLentDates.maundyThursday.getFullYear() + 1);

lentList.replaceChildren(formatLentDates(upcomingLentDates), formatLentDates(futureLentDates));
</script>
