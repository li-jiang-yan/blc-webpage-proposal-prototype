- date_en: June 1977
  description_en: Lutheran Church in Malaysia and Singapore (LCMS) appointed a committee to plan and discuss in starting a congregation in Bedok.
  date_zh: 1977 年 6 月
  description_zh: 马新信义会 (LCMS) 指定一个委员会计划和讨论在勿洛创立教会。
- date_en: July 1978
  description_en: Pastor and Mrs John T. Nelson arrived in Singapore, having assigned by the Lutheran Church to the new work in Bedok.
  date_zh: 1978 年 7 月
  description_zh: 纳尔逊牧师与夫人抵达新加坡，被信义教会指定在勿洛开工。
  img_src: assets/images/John-Nelson-Betty-Lou.jpg
- date_en: 1 November 1978
  description_en: The church rented No. 1 Jalan Tanjong to serve as a centre for the work.
  date_zh: 1978 年 11 月 1 日
  description_zh: 教会租 No. 1 Jalan Tanjong 作教会佈道所。
- date_en: 12 November 1978
  description_en: The first meeting was held. David Wang led 25 worshippers in that Thanksgiving Service with Pastor Nelson preaching the sermon.
  date_zh: 1978 年 11 月 12 日
  description_zh: 本会首次回合。在感恩崇拜会里，王大衛弟兄负责带领 25 名信徒敬拜主，纳尔逊牧师则负责讲道。
- date_en: 27 May 1979
  description_en: The first church council was elected.
  date_zh: 1979 年 5 月 27 日
  description_zh: 本堂选出第一批教堂执事。
- date_en: August 1979
  description_en: Tender was accepted by H.D.B. to build a church in Bedok.
  date_zh: 1979 年 8 月
  description_zh: 建屋局批准在勿洛盖建教堂。
- date_en: 1 May 1980
  description_en: A service was held to bless the church site and to break ground for the building.
  date_zh: 1980 年 5 月 1 日
  description_zh: 崇拜会被举行来祝福本堂地点和为建筑物开地盖建教堂。
- date_en: September 1981
  description_en: First worship service held in the new building.
  date_zh: 1981 年 9 月
  description_zh: 在新教堂建筑举行首次崇拜会。
  img_src: assets/images/Bedok-Church.jpg
- date_en: 31 October 1981
  description_en: The new church building was dedicated by Bishop Peter Foong.
  date_zh: 1981 年 10 月 31 日
  description_zh: 冯彼得会督祝圣新的教堂建筑。
  img_src: assets/images/Bedok-building-dedication.jpg
